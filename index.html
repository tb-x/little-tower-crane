<style>
/* Layout: full-bleed 3D site; HUD pinned to the corners like a crane-cab dashboard (elevator floor display left, controls right); one card for start and finish. Single, deliberate daylight look. */
:root{
  --sky:#bfe6ff;
  --ink:#1f2633;
  --hazard:#ffc21a;
  --signal:#ff5a36;
  --panel:#262d3b;
  --amber:#ffb627;
  --paper:#fffaf0;
  --muted:#4a5468;
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}

.elev{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(70px + env(safe-area-inset-left,0px));background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:8px 14px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--ink);pointer-events:none}
.elev .row{display:flex;align-items:baseline;gap:6px;color:var(--amber);font-family:var(--font-display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,182,39,.55)}
.elev .up{width:18px;height:18px;align-self:center}
.elev .of{font-size:18px;opacity:.65}
.bars{display:flex;gap:3px}
.bars i{width:10px;height:8px;border-radius:2px;background:#3b4456}
.bars i.on{background:var(--amber);box-shadow:0 0 6px rgba(255,182,39,.7)}

.tools{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;display:flex;gap:10px}
.round{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:var(--hazard);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);padding:0;transition:transform .08s,box-shadow .08s}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.round svg{width:28px;height:28px}
button:focus-visible{outline:4px solid var(--signal);outline-offset:3px}

/* home button: back to all games, top-left; the floor display sits to its right */
#home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
  box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
#home svg{width:24px;height:24px}
#home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-inline:16px;background:linear-gradient(180deg,rgba(18,38,68,.38),rgba(18,38,68,.12))}
.overlay.clear{background:none;align-items:end;padding-block-end:calc(24px + env(safe-area-inset-bottom,0px))}
.card{position:relative;overflow:hidden;background:var(--paper);border:4px solid var(--ink);border-radius:28px;padding:34px 30px 28px;width:min(500px,100%);box-sizing:border-box;text-align:center;box-shadow:0 10px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px}
.stripe{position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(-45deg,var(--ink) 0 14px,var(--hazard) 14px 28px)}
.card h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,8vw,56px);line-height:1;margin:6px 0 0;letter-spacing:.5px;text-wrap:balance}
.card p{margin:0;font-size:18px;font-weight:800;color:var(--muted);max-width:32ch;text-wrap:balance}
.play{width:128px;height:128px;border-radius:50%;padding:9px;border:0;cursor:pointer;margin-top:8px;background:repeating-linear-gradient(45deg,var(--ink) 0 12px,var(--hazard) 12px 24px);animation:pulse 1.6s ease-in-out infinite}
.play span{display:grid;place-items:center;width:100%;height:100%;box-sizing:border-box;border-radius:50%;background:var(--signal);border:4px solid var(--ink)}
.play svg{width:56px;height:56px}
.stars{display:flex;gap:6px;color:var(--amber)}
.stars svg{width:52px;height:52px;filter:drop-shadow(0 3px 0 var(--ink))}
.stars svg:nth-child(2){width:66px;height:66px;margin-top:-10px}
.overlay.clear .card{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:26px 22px 20px;gap:14px}
.overlay.clear .card h1{font-size:clamp(26px,6vw,40px);flex:1 1 220px;text-align:left}
.overlay.clear .play{width:96px;height:96px;margin:0}
.overlay.clear .play svg{width:42px;height:42px}
@media (max-width:520px){ .tools{gap:8px;flex-direction:column} .round{width:48px;height:48px} .round svg{width:24px;height:24px} .elev .row{font-size:30px} }
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.play{animation:none}}
</style>

    <svg id="icoClear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="8" r="3.6" fill="currentColor"/><path d="M8.5 1.8v1.4M2.3 8h1.4M4.1 3.6l1 1M12.9 3.6l-1 1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 20h9.5a3.8 3.8 0 0 0 0-7.6 5.2 5.2 0 0 0-9.9 1.5A3.1 3.1 0 0 0 8 20z" fill="currentColor" stroke="#ffc21a" stroke-width="1.6"/></svg>
    <svg id="icoRain" hidden viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 14h11a3.8 3.8 0 0 0 0-7.6 5.2 5.2 0 0 0-9.9 1.5A3.1 3.1 0 0 0 6.5 14z" fill="currentColor"/><path d="M8 17l-1 3M12.5 17l-1 3M17 17l-1 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <svg id="icoSnow" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6M9.6 4l2.4 2 2.4-2M9.6 20l2.4-2 2.4 2"/></svg>

  </button>
  <button class="round" id="muteBtn" aria-label="Sound on" title="Sound">
    <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg id="icoOff" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <div class="stripe"></div>
    <h1>Little Tower Crane</h1>
    <p>Tap a block. The crane lifts it. Find the spot where it fits!</p>
    <button class="play" id="playBtn" aria-label="Play"><span><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M14 8 L32 20 L14 32 Z" fill="#fff" stroke="#1f2633" stroke-width="2.5" stroke-linejoin="round"/></svg></span></button>
  </div>

<div class="overlay clear" id="winScreen" hidden>
  <div class="card">
    <div class="stripe"></div>
    <div class="stars" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="#1f2633" stroke-width="1.4" stroke-linejoin="round" d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="#1f2633" stroke-width="1.4" stroke-linejoin="round" d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></svg>
      <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="#1f2633" stroke-width="1.4" stroke-linejoin="round" d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></svg>
    </div>
    <h1>You built a skyscraper!</h1>
    <button class="play" id="againBtn" aria-label="Build another tower"><span><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M30 20a10 10 0 1 1-3-7.1"/><path d="M28 6v7h-7"/></svg></span></button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function angDiff(a, b){ let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const easeOutElastic = k => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (TAU / 3)) + 1;
function easeOutBounce(k){
  const n = 7.5625, d = 2.75;
  if (k < 1 / d) return n * k * k;
  if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
  if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375;
  return n * (k -= 2.625 / d) * k + 0.984375;
}

/* ================= world constants ================= */
const CELL = 2, GRID = 4, FLOOR_H = 2.4, ROOF_H = 1.0, SLAB_H = 0.3, BASE_H = 0.4;
const SLING = 1.4, PALLET_H = 0.25, SEG = 2.5;
const MAST = new THREE.Vector3(-8, 0, 6), MAST_BASE_TOP = 1.2, JIB = 24, R_MIN = 2.6, R_MAX = 23;
const PALETTE = [0xf25c54, 0x3fa7f5, 0xffc43d, 0x4cc26b, 0x9b6dff, 0xff8c42, 0xff70a6, 0x2ec4b6];

// Hand-made floors for the first tower: each letter is one block, the 4x4 grid is the floor plan.
const DESIGNED = [
  ['AAAA','AAAA','AABB','AABB'],
  ['AAAB','AAAB','AAAB','CCCB'],
  ['AABB','AABB','CCDD','CCDD'],
  ['AAAA','BBBC','BBBC','DDCC'],
  ['AABB','ACCB','ACCB','DDDB'],
  ['AAAB','CDDB','CDDE','CCEE'],
  ['AAAB','CADB','CCDB','EEDB'],
  ['ABBC','AABC','DEEC','DDEF'],
];

/* ================= polyomino maths ================= */
const rot1 = c => c.map(([i, j]) => [j, -i]);          // matches mesh rotation.y = +90deg
function rotN(c, k){ k = ((k % 4) + 4) % 4; for (let n = 0; n < k; n++) c = rot1(c); return c; }
function norm(c){
  const mi = Math.min(...c.map(p => p[0])), mj = Math.min(...c.map(p => p[1]));
  return c.map(([i, j]) => [i - mi, j - mj]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
const keyOf = c => norm(c).map(p => p.join(',')).join(';');
const canon = c => [0, 1, 2, 3].map(k => keyOf(rotN(c, k))).sort()[0];
function centroid(c){ return { u: c.reduce((s, p) => s + p[0], 0) / c.length + 0.5, v: c.reduce((s, p) => s + p[1], 0) / c.length + 0.5 }; }

function outline(cells){
  const set = new Set(cells.map(c => c[0] + ',' + c[1]));
  const has = (i, j) => set.has(i + ',' + j);
  const edges = [];
  for (const [i, j] of cells){
    if (!has(i, j - 1)) edges.push([[i, j], [i + 1, j]]);
    if (!has(i + 1, j)) edges.push([[i + 1, j], [i + 1, j + 1]]);
    if (!has(i, j + 1)) edges.push([[i + 1, j + 1], [i, j + 1]]);
    if (!has(i - 1, j)) edges.push([[i, j + 1], [i, j]]);
  }
  const map = new Map(); for (const e of edges) map.set(e[0] + '', e);
  const loop = []; let e = edges[0]; const start = e[0] + '';
  let guard = 0;
  do { loop.push(e[0]); e = map.get(e[1] + ''); } while (e && e[0] + '' !== start && ++guard < 200);
  const pts = [], n = loop.length;
  for (let k = 0; k < n; k++){
    const p = loop[(k - 1 + n) % n], c = loop[k], q = loop[(k + 1) % n];
    if ((c[0] - p[0]) * (q[1] - c[1]) - (c[1] - p[1]) * (q[0] - c[0]) !== 0) pts.push(c);
  }
  return { pts, edges, ok: loop.length === edges.length };
}
function insetPts(pts, d){
  const n = pts.length;
  return pts.map((c, k) => {
    const p = pts[(k - 1 + n) % n], q = pts[(k + 1) % n];
    const a = [Math.sign(c[0] - p[0]), Math.sign(c[1] - p[1])], b = [Math.sign(q[0] - c[0]), Math.sign(q[1] - c[1])];
    return [c[0] + d * (-a[1] - b[1]), c[1] + d * (a[0] + b[0])];
  });
}
const toV2 = (pts, cen) => pts.map(([u, v]) => new THREE.Vector2((u - cen.u) * CELL, -(v - cen.v) * CELL));

function parseFloor(rows){
  const m = new Map();
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (!m.has(ch)) m.set(ch, []); m.get(ch).push([i, j]); }));
  return [...m.values()];
}
function genFloor(nPieces){
  const nb = idx => { const i = idx % 4, j = (idx / 4) | 0, r = []; if (i > 0) r.push(idx - 1); if (i < 3) r.push(idx + 1); if (j > 0) r.push(idx - 4); if (j < 3) r.push(idx + 4); return r; };
  for (let attempt = 0; attempt < 300; attempt++){
    const owner = Array(16).fill(-1);
    const regions = shuffle([...Array(16).keys()]).slice(0, nPieces).map((s, r) => { owner[s] = r; return [s]; });
    let left = 16 - nPieces, stuck = false;
    while (left > 0){
      const order = regions.map((_, r) => r).sort((a, b) => regions[a].length - regions[b].length + (Math.random() - 0.5) * 2);
      let grown = false;
      for (const r of order){
        const fr = [...new Set(regions[r].flatMap(nb))].filter(x => owner[x] === -1);
        if (fr.length){ const x = pick(fr); owner[x] = r; regions[r].push(x); left--; grown = true; break; }
      }
      if (!grown){ stuck = true; break; }
    }
    if (stuck) continue;
    const pieces = regions.map(reg => reg.map(x => [x % 4, (x / 4) | 0]));
    if (pieces.some(p => p.length > 7 || !outline(p).ok)) continue;
    return pieces;
  }
  return parseFloor(DESIGNED[2]);
}

/* ================= renderer / scene ================= */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 700);
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 2; skyCanvas.height = 256;
const skyCtx = skyCanvas.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace; scene.background = skyTex;
function paintSky(top, mid, bot){
  const gr = skyCtx.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top.getStyle()); gr.addColorStop(0.6, mid.getStyle()); gr.addColorStop(1, bot.getStyle());
  skyCtx.fillStyle = gr; skyCtx.fillRect(0, 0, 2, 256); skyTex.needsUpdate = true;
}
scene.fog = new THREE.Fog(0xe2f4ff, 110, 300);

const hemi = new THREE.HemisphereLight(0xe3f2ff, 0x9b8a66, 1.5); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.3);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 1, far: 180 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const M = {
  grass: new THREE.MeshLambertMaterial({ color: 0x8fd16a }),
  dirt: new THREE.MeshLambertMaterial({ color: 0xdcbc8c }),
  concrete: new THREE.MeshStandardMaterial({ color: 0xa8a196, roughness: 0.95 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xffc21a, roughness: 0.5, metalness: 0.1 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.6 }),
  cable: new THREE.MeshBasicMaterial({ color: 0x25272c }),
  red: new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.4, emissive: 0x000000 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x2d4f7c, roughness: 0.15, metalness: 0.4, emissive: 0x0b1a2e, emissiveIntensity: 1 }),
  wood: new THREE.MeshLambertMaterial({ color: 0xc8925a }),
  white: new THREE.MeshLambertMaterial({ color: 0xffffff }),
  orange: new THREE.MeshLambertMaterial({ color: 0xff7b29 }),
  office: new THREE.MeshLambertMaterial({ color: 0x3a6ea5 }),
  light: new THREE.MeshStandardMaterial({ color: 0xdedad2, roughness: 0.8 }),
};
function add(mesh, x = 0, y = 0, z = 0, parent = scene, shadow = true){
  mesh.position.set(x, y, z); if (shadow){ mesh.castShadow = true; mesh.receiveShadow = true; } parent.add(mesh); return mesh;
}
function beam(a, b, t){
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
  const g = new THREE.BoxGeometry(t, len, t); g.translate(0, len / 2, 0);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()));
  g.translate(a.x, a.y, a.z); return g;
}
const WHITE = new THREE.Color(1, 1, 1);
function mergeParts(parts, { uv = false, color = false } = {}){
  const list = parts.map(p => {
    const g0 = p.isBufferGeometry ? p : p.geo;
    return { g: g0.index ? g0.toNonIndexed() : g0, c: !p.isBufferGeometry && p.color !== undefined ? new THREE.Color(p.color) : WHITE };
  });
  const n = list.reduce((s, { g }) => s + g.attributes.position.count, 0);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
  const uvs = uv ? new Float32Array(n * 2) : null, col = color ? new Float32Array(n * 3) : null;
  let o = 0;
  for (const { g, c } of list){

/* ---- driving: machines follow curved paths forwards or in reverse, with spinning and steering wheels ---- */
function addWheel(parent, x, z, r, w, steer = false){
  const pivot = new THREE.Group(); pivot.position.set(x, r, z); parent.add(pivot);
  const wheel = colored(wheelParts(0, 0, 0, r, w));
  pivot.add(wheel);
  return { wheel, pivot: steer ? pivot : null };
}
function makeDriver(root, wheels = [], r = 0.55){
  return { root, wheels: wheels.map(w => w.wheel), steer: wheels.filter(w => w.pivot).map(w => w.pivot), r, q: [], cur: null, speed: 0, rev: false, moving: 0 };
}
function spinWheels(d, ds){ for (const w of d.wheels) w.rotation.z -= ds / d.r; }
// queue items: {drive: [[x,z]...], rev, v, onStep} | {wait: s} | {until: fn} | {do: fn}
function updateDriver(d, dt){
  if (!d.cur && d.q.length){ d.cur = d.q.shift(); d.cur.started = false; }
  const c = d.cur; d.moving = 0;
  if (!c) return;
  if (c.drive){
    if (!c.started){
      c.started = true; c.s = 0;
      c.curve = new THREE.CatmullRomCurve3([d.root.position.clone().setY(0), ...c.drive.map(([x, z]) => new THREE.Vector3(x, 0, z))], false, 'centripetal');
      c.len = c.curve.getLength();
    }
    const remain = c.len - c.s;
    const want = Math.min(c.v || 3, Math.sqrt(4.4 * Math.max(0, remain)) + 0.2);
    d.speed = want < d.speed ? want : Math.min(want, d.speed + 2.2 * dt);
    const ds = Math.min(remain, d.speed * dt); c.s += ds;
    const u = Math.min(1, c.s / c.len), p = c.curve.getPointAt(u), tg = c.curve.getTangentAt(u);
    const yaw = c.rev ? Math.atan2(tg.z, -tg.x) : Math.atan2(-tg.z, tg.x);
    d.root.position.set(p.x, d.root.position.y, p.z);
    d.root.rotation.y += angDiff(d.root.rotation.y, yaw) * Math.min(1, dt * 10);
    const tg2 = c.curve.getTangentAt(Math.min(1, u + 2 / c.len));
    const steer = clamp(angDiff(Math.atan2(-tg.z, tg.x), Math.atan2(-tg2.z, tg2.x)) * 1.6, -0.55, 0.55) * (c.rev ? -1 : 1);
    for (const s of d.steer) s.rotation.y += (steer - s.rotation.y) * Math.min(1, dt * 6);
    spinWheels(d, c.rev ? -ds : ds);
    d.rev = !!c.rev; d.moving = ds / Math.max(dt, 1e-4);
    if (c.onStep) c.onStep(ds);
    if (remain - ds < 0.003) d.cur = null;
  } else if (c.wait !== undefined){ c.wait -= dt; if (c.wait <= 0) d.cur = null; }
  else if (c.until){ if (c.until()) d.cur = null; }
  else if (c.do){ d.cur = null; c.do(); }
}

function approach(cur, diff, rate, vmax, vmin, dt){
  const ad = Math.abs(diff);

}

// one pooled particle system for every sparkle, dust puff and firework (a ring buffer, nothing allocated per burst)
const PMAX = 4000;
const particles = (() => {
  const pos = new Float32Array(PMAX * 3), col = new Float32Array(PMAX * 3), size = new Float32Array(PMAX), alpha = new Float32Array(PMAX);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('pcolor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('psize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('palpha', new THREE.BufferAttribute(alpha, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: spriteTex }, scale: { value: 300 } },
    vertexShader: `attribute vec3 pcolor; attribute float psize; attribute float palpha; uniform float scale;
      varying vec3 vColor; varying float vAlpha;
      void main(){ vColor = pcolor; vAlpha = palpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = psize * scale / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D map; varying vec3 vColor; varying float vAlpha;
      void main(){ gl_FragColor = vec4(vColor, vAlpha) * texture2D(map, gl_PointCoord); if (gl_FragColor.a < 0.01) discard;
        #include <colorspace_fragment>
      }`,
    transparent: true, depthWrite: false,
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  return { pos, col, size, alpha, geo, mat, vel: new Float32Array(PMAX * 3), age: new Float32Array(PMAX), life: new Float32Array(PMAX), grav: new Float32Array(PMAX), base: new Float32Array(PMAX), next: 0, live: 0 };
})();
const burstCol = new THREE.Color(), burstDir = new THREE.Vector3();
function burst(pos, colors, { n = 40, speed = 5, life = 1, size = 0.4, gravity = 6, up = 2, spread = 0 } = {}){
  const P = particles;
  for (let k = 0; k < n; k++){
    const i = P.next; P.next = (P.next + 1) % PMAX;
    P.pos[i * 3] = pos.x + rand(-spread, spread); P.pos[i * 3 + 1] = pos.y; P.pos[i * 3 + 2] = pos.z + rand(-spread, spread);
    burstDir.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(speed * rand(0.4, 1));
    P.vel[i * 3] = burstDir.x; P.vel[i * 3 + 1] = burstDir.y + up; P.vel[i * 3 + 2] = burstDir.z;
    burstCol.setHex(pick(colors)); P.col[i * 3] = burstCol.r; P.col[i * 3 + 1] = burstCol.g; P.col[i * 3 + 2] = burstCol.b;
    P.age[i] = 0; P.life[i] = life; P.grav[i] = gravity; P.base[i] = size; P.size[i] = size; P.alpha[i] = 1;
  }
  P.live = Math.min(PMAX, P.live + n);
  P.geo.attributes.pcolor.needsUpdate = true;
}
function updateBursts(dt){
  const P = particles;
  if (!P.live) return;
  let live = 0;
  const drag = 1 - 0.8 * dt;
  for (let i = 0; i < PMAX; i++){
    if (P.age[i] >= P.life[i]) continue;
    P.age[i] += dt;
    if (P.age[i] >= P.life[i]){ P.alpha[i] = 0; P.size[i] = 0; continue; }
    live++;
    const o = i * 3;
    P.vel[o + 1] -= P.grav[i] * dt; P.vel[o] *= drag; P.vel[o + 1] *= drag; P.vel[o + 2] *= drag;
    P.pos[o] += P.vel[o] * dt; P.pos[o + 1] += P.vel[o + 1] * dt; P.pos[o + 2] += P.vel[o + 2] * dt;
    P.alpha[i] = 1 - Math.pow(P.age[i] / P.life[i], 2);
  }
  P.live = live;
  const a = P.geo.attributes;
  a.position.needsUpdate = true; a.palpha.needsUpdate = true; a.psize.needsUpdate = true;
}

let actx = null, master = null, hum = null, noiseBuf = null, muted = false;
function initAudio(){
  if (actx){ actx.resume?.(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 46;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200;
    const g = actx.createGain(); g.gain.value = 0;
    o.connect(f).connect(g).connect(master); o.start(); hum = { o, g };
  } catch (e){ actx = null; }
}
function tone(freq, dur, { type = 'sine', vol = 0.3, slide = null, delay = 0 } = {}){
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, { vol = 0.3, freq = 1200, q = 1, delay = 0 } = {}){
  if (!actx || muted) return;
  const t = actx.currentTime + delay, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}

function layoutYard(pieces, animate){
  shuffle(pieces);
  const X0 = -10, X1 = 10, GAP = 1.2, rows = [[]]; let x = X0;
  for (const p of pieces){
    const opts = [0, 1, 2, 3].map(k => { const rc = norm(rotN(p.cells, k)); return { k, w: Math.max(...rc.map(c => c[0])) + 1, d: Math.max(...rc.map(c => c[1])) + 1 }; }).filter(o => o.w >= o.d);
    const o = pick(opts), wid = o.w * CELL;
    if (x + wid > X1 && rows.at(-1).length){ rows.push([]); x = X0; }
    rows.at(-1).push({ p, ...o }); x += wid + GAP;
  }
  let z = 10.2, i = 0;
  for (const row of rows){
    const total = row.reduce((s, it) => s + it.w * CELL, 0) + GAP * (row.length - 1);
    let rx = -total / 2 + 1;
    for (const it of row){
      const p = it.p, rc = rotN(p.cells, it.k);
      const mi = Math.min(...rc.map(c => c[0])), mj = Math.min(...rc.map(c => c[1]));
      const ci = rc.reduce((s, c) => s + c[0], 0) / rc.length, cj = rc.reduce((s, c) => s + c[1], 0) / rc.length;
      p.yardPos.set(rx + (ci - mi + 0.5) * CELL, PALLET_H, z + (cj - mj + 0.5) * CELL);
      p.yardRot = p.rot = p.targetRot = it.k * Math.PI / 2;
      p.group.position.copy(p.yardPos); p.group.rotation.y = p.rot;
      const pal = add(new THREE.Mesh(new THREE.BoxGeometry(it.w * CELL + 0.3, PALLET_H, it.d * CELL + 0.3), M.wood), rx + it.w * CELL / 2, PALLET_H / 2, z + it.d * CELL / 2);
      pal.userData.piece = p; p.pallet = pal; game.pallets.push(pal);
      if (animate){
        const delay = 0.6 + i * 0.22, gy = p.yardPos.y;
        p.group.position.y = 18; pal.scale.setScalar(0.001);
        tween(0.35, k => pal.scale.setScalar(Math.max(0.001, k)), null, easeOutBack, delay - 0.3);
        tween(0.9, k => p.group.position.y = 18 + (gy - 18) * k, () => { sfx.pop(); burst(new THREE.Vector3(p.yardPos.x, 0.3, p.yardPos.z), [0xd8c7a8, 0xc9b38c], { n: 18, speed: 2.5, life: 0.7, size: 0.6, gravity: 1, up: 1.2, spread: 1 }); }, easeOutBounce, delay);
      }
      rx += it.w * CELL + GAP; i++;
    }
    z += Math.max(...row.map(it => it.d)) * CELL + GAP;
  }
}

function setupFloor(n, animate){

  game.slots = f.cells.map(cells => makeSlot(cells, colorOf.get(canon(cells)), f.hint, y, animate));

function bestRot(p, slot){
  let best = null, bd = 1e9;
  for (let k = 0; k < 4; k++){
    if (keyOf(rotN(p.cells, k)) !== slot.key) continue;
    const d = angDiff(p.rot, k * Math.PI / 2);
    if (Math.abs(d) < bd){ bd = Math.abs(d); best = p.rot + d; }
  }
  return best ?? p.rot;
}
const nearestEquivalent = (from, a) => from + angDiff(from, a);

function fetchPiece(p){
  game.state = 'busy'; hideHint(); game.idleT = 0; setHover(null);
  const ty = travelY(game.floorIdx), q = crane.queue;
  q.push({ type: 'y', y: Math.max(ty, crane.y) });
  q.push({ type: 'to', x: p.yardPos.x, z: p.yardPos.z });
  q.push({ type: 'y', y: PALLET_H + p.h + SLING });
  q.push({ type: 'fn', f: () => { crane.carried = p; p.state = 'carried'; p.targetRot = p.rot; crane.swing.set(0, 0); crane.swingV.set(0, 0); sfx.clank(); } });
  q.push({ type: 'wait', s: 0.15 });
  q.push({ type: 'y', y: ty });
  q.push({ type: 'fn', f: () => {
    game.state = 'carrying'; game.carryT = 0; game.wrong = 0; game.snap = null; game.overBuilding = false;
    game.target.set(0, 0, 2.5);
    if (!game.saidCarry){ game.saidCarry = true; say(p.roof ? 'Now put the roof on top!' : 'Now find where it fits!'); }
  } });
}

function swapTo(np){
  const p = crane.carried; game.state = 'busy'; ghost.visible = false; hideHint(); game.snap = null;
  p.targetRot = nearestEquivalent(p.rot, p.yardRot);
  const q = crane.queue;
  q.push({ type: 'to', x: p.yardPos.x, z: p.yardPos.z });
  q.push({ type: 'y', y: PALLET_H + p.h + SLING });
  q.push({ type: 'fn', f: () => { crane.carried = null; p.state = 'yard'; p.rot = p.targetRot; p.group.position.copy(p.yardPos); p.group.rotation.y = p.rot; sfx.thud(); } });
  q.push({ type: 'fn', f: () => fetchPiece(np) });
}

function placeAt(slot){
  const p = crane.carried, n = game.floorIdx, sy = surfaceY(n);
  game.state = 'busy'; ghost.visible = false; hideHint();
  p.targetRot = bestRot(p, slot);
  const q = crane.queue;
  q.push({ type: 'to', x: slot.x, z: slot.z });
  q.push({ type: 'y', y: sy + p.h + SLING });
  q.push({ type: 'fn', f: () => {
    crane.carried = null; p.state = 'placed'; slot.filled = true;
    p.rot = p.targetRot; p.group.rotation.set(0, p.rot, 0); p.group.position.set(slot.x, sy, slot.z); buildFacade(p, true);
    disposeSlot(slot);
    tween(0.6, k => { p.group.scale.set(1 + 0.08 * (1 - k), 0.86 + 0.14 * k, 1 + 0.08 * (1 - k)); }, () => p.group.scale.set(1, 1, 1), easeOutElastic);
    sfx.place();
    burst(new THREE.Vector3(slot.x, sy + p.h + 0.3, slot.z), [p.color, 0xffffff, 0xffe066], { n: 46, speed: 6, life: 1, size: 0.5, gravity: 7, up: 4 });
    burst(new THREE.Vector3(slot.x, sy + 0.2, slot.z), [0xe0d6c6, 0xcfc2ad], { n: 16, speed: 3, life: 0.6, size: 0.7, gravity: 0.5, up: 0.6, spread: 1.2 });
    const left = game.slots.filter(s => !s.filled).length;
    if (left > 0 && Math.random() < 0.65) say(pick(['Great!', 'Perfect fit!', 'Super!', 'Yes!', 'Well done!', 'Nice one!', 'Awesome!']));
  } });
  q.push({ type: 'wait', s: 0.25 });
  q.push({ type: 'y', y: travelY(n) });
  q.push({ type: 'fn', f: () => {
    if (game.slots.every(s => s.filled)) floorComplete();
    else { game.state = 'idle'; game.idleT = 0; }
  } });
}

function nope(){
  const p = crane.carried; if (!p) return;
  p.wiggle = 0.6; sfx.nope(); game.wrong++;
  if (game.wrong === 1) say("Hmm, it doesn't fit there. Try another spot!");
  else if (game.wrong === 3) say('Look for the arrow!');
}

function floorComplete(){
  const n = game.floorIdx, f = game.floors[n], sy = surfaceY(n);
  game.state = 'busy';
  if (f.roof){ win(); return; }
  sfx.fanfare(); say(n === game.floors.length - 2 ? 'Floor done! Only the roof is left!' : pick(['Floor complete! Let\'s build higher!', 'Hooray, another floor!', 'Great building! Up we go!']));
  for (const [x, z] of [[-4, -4], [4, -4], [4, 4], [-4, 4]])
    burst(new THREE.Vector3(x, sy + FLOOR_H + 0.5, z), PALETTE, { n: 40, speed: 7, life: 1.4, size: 0.5, gravity: 6, up: 6 });
  for (const pal of game.pallets) tween(0.4, k => pal.scale.setScalar(Math.max(0.001, 1 - k)), () => disposePallet(pal), easeOutCubic, 0.3);
  game.pallets = [];
  const slab = new THREE.Mesh(slabGeo, slabMat(f.style.def.slab)); slab.castShadow = slab.receiveShadow = true;
  const yEnd = sy + FLOOR_H + SLAB_H / 2; slab.position.y = yEnd + 14; scene.add(slab); game.slabs.push(slab);
  tween(0.9, k => slab.position.y = yEnd + 14 * (1 - k), () => { sfx.thud(); burst(new THREE.Vector3(0, yEnd, 0), [0xe0d6c6, 0xffffff], { n: 40, speed: 5, life: 0.8, size: 0.7, gravity: 1, up: 0.5, spread: 3 }); }, easeOutBounce, 0.5);
  after(1.6, () => {
    game.floorIdx = n + 1; updateHud();
    const ns = mastNeed(n + 1);
    if (ns > mastSegs.length){
      const from = slew.position.y; setMastSegments(ns, true);
      const to = MAST_BASE_TOP + ns * SEG; tween(0.8, k => slew.position.y = from + (to - from) * k);
      tone(110, 0.8, { type: 'sawtooth', vol: 0.06, slide: 160 });
    }
    crane.queue.push({ type: 'wait', s: 0.9 }, { type: 'y', y: travelY(n + 1) });
    setupFloor(n + 1, true);
    if (game.floors[n + 1].roof) after(1.2, () => say('Last one: the roof!'));
    after(1.4 + game.slots.length * 0.22, () => { if (game.state === 'busy') { game.state = 'idle'; game.idleT = 0; } });
  });
}

function win(){
  game.state = 'won'; game.fwT = 0.6; updateHud();
  sfx.win(); say('Hooray! You built a skyscraper!');
  tween(1.5, k => game.winGlow = k);
  crane.queue.push({ type: 'y', y: slew.position.y - 2.5 });
  after(2.6, () => { $('winScreen').hidden = false; $('againBtn').focus({ preventScroll: true }); });
}

function resetGame(round){
  for (const p of game.pieces) disposePiece(p);
  for (const s of game.slots) disposeSlot(s);
  for (const s of game.slabs) scene.remove(s);   // slabs share one geometry and cached materials
  for (const s of game.pallets) disposePallet(s);
  Object.assign(game, { pieces: [], slots: [], slabs: [], pallets: [], round, floorIdx: 0, snap: null, hintSlot: null, wrong: 0, idleT: 0, saidCarry: false });
  tweens.length = 0; crane.queue = []; crane.cur = null; crane.carried = null; ghost.visible = false; hideHint();
  game.winGlow = 0;
  game.floors = makeFloors(round);
  const ns = mastNeed(0); setMastSegments(ns, false); slew.position.y = MAST_BASE_TOP + ns * SEG;
  craneAim(0, 2.5); crane.theta = crane.tTheta; crane.r = crane.tR; crane.y = crane.tY = travelY(0);
  setupFloor(0, round > 0);
  updateHud();
}

/* ================= input ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitV = new THREE.Vector3();
function setRay(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function pickYard(){
  const objs = [];
  for (const p of game.pieces) if (p.state === 'yard'){ objs.push(p.body); if (p.pallet) objs.push(p.pallet); }
  const h = ray.intersectObjects(objs, false)[0];
  return h ? h.object.userData.piece : null;
}
function setHover(p){
  if (game.hovered === p) return;
  if (game.hovered) game.hovered.mat.emissive.setHex(0x000000);
  game.hovered = p; if (p) p.mat.emissive.setHex(0x2a2a2a);
}
const LIM = GRID * CELL / 2 + 0.9;
function computeSnap(pt){
  const p = crane.carried; if (!p) return;
  game.overBuilding = Math.abs(pt.x) < LIM && Math.abs(pt.z) < LIM;
  const ci = Math.floor(pt.x / CELL + GRID / 2), cj = Math.floor(pt.z / CELL + GRID / 2);
  let best = null, bd = 1e9;
  for (const s of game.slots){
    if (s.filled || s.canon !== p.canon) continue;
    const inside = s.cells.some(c => c[0] === ci && c[1] === cj);
    const d = Math.hypot(pt.x - s.x, pt.z - s.z);
    if ((inside || d < 2.4) && d - (inside ? 100 : 0) < bd){ bd = d - (inside ? 100 : 0); best = s; }
  }
  game.snap = best;
  if (best) p.targetRot = bestRot(p, best);
}
function updateTarget(){
  plane.constant = -surfaceY(game.floorIdx);
  if (!ray.ray.intersectPlane(plane, hitV)) return;
  game.target.set(clamp(hitV.x, -7, 7), 0, clamp(hitV.z, -7, 8));
  computeSnap(hitV);
}
function tryDrop(){
  if (game.state !== 'carrying') return;
  if (game.snap) placeAt(game.snap);
  else if (game.overBuilding) nope();
}
canvas.addEventListener('pointerdown', e => {
  if (game.state === 'menu' || game.state === 'won') return;
  initAudio(); setRay(e);
  const p = pickYard();
  if (p){
    if (game.state === 'idle'){ sfx.tap(); fetchPiece(p); }
    else if (game.state === 'carrying'){ sfx.tap(); swapTo(p); }
    return;
  }
  if (game.state === 'carrying'){ game.pressing = true; updateTarget(); try { canvas.setPointerCapture(e.pointerId); } catch (err){} }
});
canvas.addEventListener('pointermove', e => {
  if (game.state === 'menu' || game.state === 'won') return;
  setRay(e);
  if (e.pointerType === 'mouse' && !game.pressing){
    const p = (game.state === 'idle' || game.state === 'carrying') ? pickYard() : null;
    setHover(game.state === 'idle' ? p : null);
    canvas.style.cursor = p ? 'pointer' : '';
  }
  if (game.state === 'carrying' && (e.pointerType === 'mouse' || game.pressing)) updateTarget();
});
canvas.addEventListener('pointerup', () => { if (game.pressing){ game.pressing = false; tryDrop(); } });
canvas.addEventListener('pointercancel', () => { game.pressing = false; });
addEventListener('keydown', e => {
  if (game.state !== 'carrying' || (e.target instanceof Element && e.target.closest('button, #home'))) return;
  const t = game.target; let moved = true;
  switch (e.key){
    case 'ArrowLeft': t.x -= CELL; break;
    case 'ArrowRight': t.x += CELL; break;
    case 'ArrowUp': t.z -= CELL; break;
    case 'ArrowDown': t.z += CELL; break;
    case ' ': case 'Enter': e.preventDefault(); tryDrop(); return;
    default: moved = false;
  }
  if (moved){ e.preventDefault(); t.x = clamp(t.x, -6, 6); t.z = clamp(t.z, -6, 6); computeSnap(t); }
});

/* ================= camera ================= */
const camLook = new THREE.Vector3(0, 4, 7), camLookT = new THREE.Vector3();
let camDist = 40, camYaw = 0;
const baseDir = new THREE.Vector3(0.5, 0.48, 1).normalize();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function updateCamera(dt, t){
  const top = surfaceY(game.floorIdx) + (game.state === 'won' ? 2 : 0);
  const aspect = camera.aspect, fit = aspect < 1.5 ? Math.pow(1.5 / aspect, 0.55) : 1;
  baseDir.set(0.5, aspect < 1 ? 0.75 : 0.48, 1).normalize();
  const won = game.state === 'won';
  camLookT.set(-1, 4 + top * (won ? 0.4 : 0.42), 7 + Math.min(top, 20) * 0.05);
  const D = (40 + top * (won ? 0.6 : 1.0)) * fit;
  const k = Math.min(1, dt * 1.6);
  camDist += (D - camDist) * k; camLook.lerp(camLookT, k);
  camYaw = game.state === 'won' && !reduceMotion ? camYaw + dt * 0.12 : camYaw * (1 - k);
  const dir = baseDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
  camera.position.copy(camLook).addScaledVector(dir, camDist);
  if (!reduceMotion) camera.position.x += Math.sin(t * 0.25) * 0.5;
  camera.lookAt(camLook);
  sun.position.set(camLook.x + 18, camLook.y + 42, camLook.z + 12); sun.target.position.copy(camLook);
}

/* ================= main loop ================= */
function stepCrane(dt){
  if (!crane.cur && crane.queue.length){ crane.cur = crane.queue.shift(); crane.cur.started = false; }
  const a = crane.cur;
  if (a){
    if (!a.started){
      a.started = true; a.el = 0;
      if (a.type === 'to') craneAim(a.x, a.z);
      if (a.type === 'y') crane.tY = a.y;
    }
    a.el += dt;
    let done = false;
    if (a.type === 'fn'){ done = true; }
    else if (a.type === 'wait') done = a.el >= a.s;
    else if (a.type === 'y') done = Math.abs(crane.y - crane.tY) < 0.02;
    else if (a.type === 'to'){
      done = Math.abs(angDiff(crane.theta, crane.tTheta)) < 0.004 && Math.abs(crane.r - crane.tR) < 0.03;
      if (crane.carried) done = done && Math.abs(crane.carried.targetRot - crane.carried.rot) < 0.03 && crane.swing.length() < 0.12;
    }
    if (done){ crane.cur = null; if (a.type === 'fn') a.f(); }
  }
  const th0 = crane.theta, r0 = crane.r, y0 = crane.y;
  crane.theta = approach(crane.theta, angDiff(crane.theta, crane.tTheta), 3.2, 1.3, 0.1, dt);
  crane.r = approach(crane.r, crane.tR - crane.r, 3.4, 10, 0.5, dt);
  crane.y = approach(crane.y, crane.tY - crane.y, 3.6, 8, 0.5, dt);
  const sp = (Math.abs(angDiff(th0, crane.theta)) * crane.r + Math.abs(crane.r - r0) + Math.abs(crane.y - y0)) / Math.max(dt, 1e-4);
  crane.speed += (sp - crane.speed) * Math.min(1, dt * 6);

  slew.rotation.y = crane.theta;
  trolley.position.x = crane.r;
  const ly = crane.y - slew.position.y;
  hook.position.y = ly;
  cableMesh.scale.y = Math.max(0.01, -ly);
  crane.hook.set(MAST.x + crane.r * Math.cos(crane.theta), crane.y, MAST.z - crane.r * Math.sin(crane.theta));

  // pendulum for the hanging block
  crane.vel.subVectors(crane.hook, crane.prevHook).divideScalar(Math.max(dt, 1e-4));
  const ax = clamp((crane.vel.x - crane.prevVel.x) / Math.max(dt, 1e-4), -40, 40);
  const az = clamp((crane.vel.z - crane.prevVel.z) / Math.max(dt, 1e-4), -40, 40);
  crane.prevHook.copy(crane.hook); crane.prevVel.copy(crane.vel);
  const C = game.state === 'busy' ? 7 : 2.4;
  crane.swingV.x += (-7 * crane.swing.x - C * crane.swingV.x - ax * 0.05) * dt;
  crane.swingV.y += (-7 * crane.swing.y - C * crane.swingV.y - az * 0.05) * dt;
  crane.swing.addScaledVector(crane.swingV, dt);
  if (crane.swing.length() > 0.8) crane.swing.setLength(0.8);

  const p = crane.carried;
  slings.visible = !!p;
  if (p){
    p.rot += (p.targetRot - p.rot) * Math.min(1, dt * 6);
    if (Math.abs(p.targetRot - p.rot) < 0.002) p.rot = p.targetRot;
    let wig = 0; if (p.wiggle > 0){ p.wiggle = Math.max(0, p.wiggle - dt); wig = Math.sin(p.wiggle * 40) * 0.2 * (p.wiggle / 0.6); }
    p.group.rotation.set(0, p.rot + wig, 0);
    p.group.position.set(crane.hook.x + crane.swing.x, crane.y - SLING - p.h, crane.hook.z + crane.swing.y);
    p.group.updateMatrixWorld();
    const arr = slingGeo.attributes.position.array, v = new THREE.Vector3(); let o = 0;
    for (const [sx, sz] of [[-0.7, -0.7], [0.7, -0.7], [0.7, 0.7], [-0.7, 0.7]]){
      arr[o++] = crane.hook.x; arr[o++] = crane.y - 0.05; arr[o++] = crane.hook.z;
      v.set(sx, p.h, sz); p.group.localToWorld(v); arr[o++] = v.x; arr[o++] = v.y; arr[o++] = v.z;
    }
    slingGeo.attributes.position.needsUpdate = true;
  }

  if (hum && actx){
    const g = muted ? 0 : Math.min(1, crane.speed / 7) * 0.05;
    hum.g.gain.setTargetAtTime(g, actx.currentTime, 0.08);
    hum.o.frequency.setTargetAtTime(42 + Math.min(crane.speed, 10) * 3, actx.currentTime, 0.1);
  }
}

const clock = new THREE.Clock();
let elapsed = 0;
function frame(){
  update(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function update(dt){
  elapsed += dt; const t = elapsed;

  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; if (!tw) continue; tw.t += dt; if (tw.t < 0) continue;
    const k = Math.min(1, tw.t / tw.dur); tw.fn(tw.ease(k));
    if (k >= 1){ tweens.splice(tweens.indexOf(tw), 1); tw.done && tw.done(); }
  }

  const n = game.floorIdx, sy = surfaceY(n);
  if (game.state === 'carrying'){
    const s = game.snap;
    craneAim(s ? s.x : game.target.x, s ? s.z : game.target.z);
    crane.tY = travelY(n);
    game.carryT += dt;
    if (s){
      ghost.geometry = crane.carried.geo; ghost.position.set(s.x, sy + 0.02, s.z); ghost.rotation.y = s ? crane.carried.targetRot : 0;
      ghostMat.opacity = 0.32 + 0.14 * Math.sin(t * 7); ghost.visible = true;
    } else ghost.visible = false;
    if ((game.carryT > 9 || game.wrong >= 2) && !game.hintSlot){
      const hs = game.slots.find(sl => !sl.filled && sl.canon === crane.carried.canon);
      if (hs){ game.hintSlot = hs; showHint(new THREE.Vector3(hs.x, sy + 0.2, hs.z)); }
    }
  } else ghost.visible = false;

  if (game.state === 'idle'){
    game.idleT += dt;
    const delay = game.floorIdx === 0 && game.round === 0 ? 1.2 : 6;
    if (game.idleT > delay && !arrow.visible){
      const yp = game.pieces.filter(p => p.state === 'yard');
      if (yp.length){ const p = pick(yp); showHint(new THREE.Vector3(p.yardPos.x, p.yardPos.y + p.h + 0.3, p.yardPos.z)); }
    }
  }
  if (arrow.visible){
    arrow.position.set(arrowBase.x, arrowBase.y + Math.abs(Math.sin(t * 4)) * 0.9, arrowBase.z);
    arrow.rotation.y += dt * 2;
  }
  for (const s of game.slots){
    if (s.filled) continue;
    if (s === game.hintSlot){ s.fillMat.color.setHex(crane.carried ? crane.carried.color : s.color); s.fillMat.opacity = 0.45 + 0.35 * Math.sin(t * 6); }
    else { s.fillMat.color.setHex(s.hint ? s.color : 0xffffff); s.fillMat.opacity = s.baseOpacity; }
  }

  if (game.state === 'won'){
    game.fwT -= dt;
    if (game.fwT <= 0){
      game.fwT = rand(0.3, 0.7);
      const top = surfaceY(n) + ROOF_H;
      burst(new THREE.Vector3(rand(-16, 16), top + rand(6, 16), rand(-14, 4)), [pick(PALETTE), pick(PALETTE), 0xffffff], { n: 90, speed: rand(6, 9), life: 1.7, size: 0.6, gravity: 2.5, up: 0 });
      sfx.boom();
    }
  }

  beacon.material.emissive.setHex(Math.sin(t * 5) > 0.3 ? 0xff2020 : 0x000000);
  for (const c of clouds){ c.position.x += c.userData.v * dt; if (c.position.x > 190) c.position.x = -190; }

  stepCrane(dt);
  updateBursts(dt);
  updateWorld(dt, t);
  updateWeather(dt, t);
  updateDayNight(dt);
  updateCamera(dt, t);
  placeSkyBodies();
}

function resize(){
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  if (w < 2 || h < 2) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  particles.mat.uniforms.scale.value = renderer.domElement.height / 2;
}

  tapScreen(x, y){ const r = canvas.getBoundingClientRect(); const o = { clientX: r.left + x * r.width, clientY: r.top + y * r.height, pointerId: 1, pointerType: 'touch', bubbles: true };
    canvas.dispatchEvent(new PointerEvent('pointerdown', o)); canvas.dispatchEvent(new PointerEvent('pointerup', o)); return game.state; },
  project(x, y, z){ const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2, (1 - v.y) / 2]; },
  finishFloor(){
    if (game.state !== 'idle') return false;
    const sy = surfaceY(game.floorIdx);
    for (const s of game.slots) if (!s.filled){
      const p = game.pieces.find(q => q.state === 'yard' && q.canon === s.canon);
      p.rot = p.targetRot = bestRot(p, s); p.state = 'placed'; p.group.position.set(s.x, sy, s.z); p.group.rotation.y = p.rot; buildFacade(p, true);
      s.filled = true; disposeSlot(s);
    }
    floorComplete(); return true;
  },
} };
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// three.js) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
  // When sw.js says a newer version of this page has just been downloaded, reload once to show it: straight away if
  // nobody has tapped or pressed a key yet, otherwise when the page comes back after 5+ minutes away, so a game in
  // progress is never lost. A timestamp in sessionStorage stops a second reload within 30 s.
  let started = false, newer = false, hiddenAt = 0;
  addEventListener('pointerdown', () => { started = true; }, true);
  addEventListener('keydown', () => { started = true; }, true);
  const reload = () => {
    const key = 'tbx-sw-reload:' + location.pathname;
    try { if (Date.now() - (+sessionStorage.getItem(key) || 0) < 30000) return; sessionStorage.setItem(key, Date.now()); } catch { return; }
    location.reload();
  };
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.updated) { newer = true; if (!started) reload(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (newer && hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) reload();
  });
}
</script>
